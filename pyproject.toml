[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-dashboard"
version = "1.0.0"
description = "A command-line summary of your GitHub activity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Franco Riccobelli" }]
keywords = ["cli", "github", "activity", "dashboard"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

# One runtime dependency, on purpose: talking to the GitHub REST API is the
# whole point, and `requests` handles sessions, retries and JSON decoding well
# enough to earn its place. Everything else should come from the standard
# library.
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gh-dashboard = "gh_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gh_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
